[package]
name = "bocchi"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dotenvy = "0.15"
eframe = "0.37"
poise = "0.6"
rand = "0.9"
serde_json = "1.0.154"
songbird = { version = "0.6", features = ["builtin-queue"] }
symphonia = { version = "0.5", features = ["aac", "isomp4", "mkv", "mp3", "ogg", "pcm", "wav", "flac"] }
tokio = { version = "1.53.3", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
